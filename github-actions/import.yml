# IMPORT - adopt an existing vSphere cluster, VDS, port groups and VMs into
# that cluster's state. Real vCenter object paths come from imports/*.json.
# Canonical source: github-actions/import.yml

name: Import - Terraform import existing resources

on:
  workflow_dispatch:
    inputs:
      clusterName:
        description: Cluster folder under clusters/
        required: true
        default: CLUSTER-PROD-01
        type: string
      cloud:
        description: State backend
        required: true
        default: aws
        type: choice
        options:
          - aws
          - azure
      importCluster:
        description: Import the compute cluster (and vSAN settings)
        required: true
        default: true
        type: boolean
      importNetworks:
        description: Import the VDS and port groups
        required: true
        default: true
        type: boolean
      importVms:
        description: Import the virtual machines
        required: true
        default: true
        type: boolean
      dryRun:
        description: Only print what would be imported
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  VSPHERE_SERVER: ${{ vars.VSPHERE_SERVER }}
  VSPHERE_USER: ${{ vars.VSPHERE_USER }}
  ALLOW_UNVERIFIED_SSL: ${{ vars.ALLOW_UNVERIFIED_SSL }}
  DATACENTER_NAME: ${{ vars.DATACENTER_NAME }}
  DATASTORE_NAME: ${{ vars.DATASTORE_NAME }}
  ISO_DATASTORE_NAME: ${{ vars.ISO_DATASTORE_NAME }}
  AWS_BUCKET: ${{ vars.AWS_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_LOCK_TABLE: ${{ vars.AWS_LOCK_TABLE }}
  AWS_KEY_PREFIX: ${{ vars.AWS_KEY_PREFIX }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
  AZURE_CONTAINER: ${{ vars.AZURE_CONTAINER }}
  AZURE_KEY_PREFIX: ${{ vars.AZURE_KEY_PREFIX }}
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

jobs:
  import:
    name: Import ${{ inputs.clusterName }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform init
        uses: ./.github/actions/terraform-init
        with:
          clusterName: ${{ inputs.clusterName }}
          cloud: ${{ inputs.cloud }}

      - name: Import cluster, networks, vSAN and VMs
        working-directory: clusters/${{ inputs.clusterName }}
        env:
          TF_VAR_vsphere_password: ${{ secrets.TF_VAR_vsphere_password }}
          DO_CLUSTER: ${{ inputs.importCluster }}
          DO_NETWORKS: ${{ inputs.importNetworks }}
          DO_VMS: ${{ inputs.importVms }}
          DRY: ${{ inputs.dryRun }}
        run: |
          set -euo pipefail

          # Normalise GitHub Actions booleans to 0/1.
          norm() { [ "${1,,}" = "true" ] && echo 1 || echo 0; }
          DO_CLUSTER=$(norm "$DO_CLUSTER")
          DO_NETWORKS=$(norm "$DO_NETWORKS")
          DO_VMS=$(norm "$DO_VMS")
          DRY=$(norm "$DRY")

          DC=$(jq -r '.datacenter_name' "$GITHUB_WORKSPACE/globals.json")
          CREATE_NETWORKS=$(jq -r '.create_networks // true' cluster.json)
          IMPORT_DIR='imports'

          if [ ! -d "$IMPORT_DIR" ]; then
            echo "::error::Missing $IMPORT_DIR/ in this cluster folder. Copy it from another cluster and edit the real vCenter object paths."
            exit 1
          fi

          echo "=== Import plan for $(jq -r '.name' cluster.json) (datacenter: $DC) ==="
          if [ "$DRY" -eq 1 ]; then
            echo "DRY RUN - no state will be changed."
          fi

          # {datacenter} keeps the JSON files independent of DATACENTER_NAME;
          # fully literal paths are also accepted.
          expand_path() {
            printf '%s' "${1//\{datacenter\}/$DC}"
          }

          import_resource() {
            local address="$1"
            local object_path
            object_path=$(expand_path "$2")

            if terraform state list "$address" >/dev/null 2>&1; then
              echo "SKIP (already in state): $address"
              return 0
            fi
            if [ "$DRY" -eq 1 ]; then
              echo "WOULD IMPORT: $address <- $object_path"
              return 0
            fi

            echo "IMPORT: $address <- $object_path"
            if terraform import -input=false -no-color "$address" "$object_path"; then
              echo "  OK: $address"
            else
              echo "::warning::Failed to import $address from $object_path. Check the object path and that the resource exists."
            fi
          }

          if [ "$DO_CLUSTER" -eq 1 ]; then
            if [ -f "$IMPORT_DIR/cluster.json" ]; then
              echo "--- Compute cluster (vSAN is imported with it) ---"
              ADDR=$(jq -r '.resource // "vsphere_compute_cluster.this"' "$IMPORT_DIR/cluster.json")
              PATH_VALUE=$(jq -r '.path // empty' "$IMPORT_DIR/cluster.json")
              if [ -n "$PATH_VALUE" ]; then
                import_resource "$ADDR" "$PATH_VALUE"
              else
                echo "::warning::imports/cluster.json has no path; skipping."
              fi
              echo "NOTE: vSAN settings, disk groups, fault domains and stretched-cluster"
              echo "      configuration are properties of vsphere_compute_cluster.this, so"
              echo "      they are adopted together with the cluster - no separate import."
            else
              echo "::warning::imports/cluster.json not found; skipping cluster import."
            fi
          fi

          if [ "$DO_NETWORKS" -eq 1 ]; then
            if [ "$CREATE_NETWORKS" != "true" ]; then
              echo "--- Networks skipped: create_networks is false (existing networks are data sources) ---"
            elif [ -f "$IMPORT_DIR/networks.json" ]; then
              echo "--- Distributed switch and port groups ---"
              VDS_ADDR=$(jq -r '.vds.resource // "vsphere_distributed_virtual_switch.this[0]"' "$IMPORT_DIR/networks.json")
              VDS_PATH=$(jq -r '.vds.path // empty' "$IMPORT_DIR/networks.json")
              if [ -n "$VDS_PATH" ]; then
                import_resource "$VDS_ADDR" "$VDS_PATH"
              else
                echo "::warning::imports/networks.json has no vds.path; skipping VDS import."
              fi

              jq -r '.port_groups[]? | [.resource, .path] | @tsv' "$IMPORT_DIR/networks.json" |
              while IFS=$'\t' read -r addr path; do
                [ -n "$path" ] || continue
                import_resource "$addr" "$path"
              done
            else
              echo "::warning::imports/networks.json not found; skipping network imports."
            fi
          fi

          if [ "$DO_VMS" -eq 1 ]; then
            if [ -f "$IMPORT_DIR/machines.json" ]; then
              echo "--- Virtual machines ---"
              jq -r '.machines[]? | [.resource, .path] | @tsv' "$IMPORT_DIR/machines.json" |
              while IFS=$'\t' read -r addr path; do
                [ -n "$path" ] || continue
                import_resource "$addr" "$path"
              done
            else
              echo "::warning::imports/machines.json not found; skipping VM imports."
            fi
          fi

          echo "--- Resources currently in state ---"
          terraform state list

      - name: Post-import plan (review drift)
        working-directory: clusters/${{ inputs.clusterName }}
        env:
          TF_VAR_vsphere_password: ${{ secrets.TF_VAR_vsphere_password }}
        run: |
          set -euo pipefail
          echo "=== Plan after import (expected drift: update JSON to match reality) ==="
          terraform plan -input=false -no-color
